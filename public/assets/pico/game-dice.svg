    <rect x="0" y="0" width="96" height="96" rx="20" fill="#FFFFFF" stroke="#E5E1FA" stroke-width="4"/>
    <circle cx="26" cy="26" r="9" fill="#7C3AED"/>
    <circle cx="70" cy="26" r="9" fill="#7C3AED"/>
    <circle cx="48" cy="48" r="9" fill="#F43F5E"/>
    <circle cx="26" cy="70" r="9" fill="#7C3AED"/>
    <circle cx="70" cy="70" r="9" fill="#7C3AED"/>
  </g>
  <!-- sparkles -->
